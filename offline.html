<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#4F46E5" />
  <title>iSMART - Offline</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
           font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; background: #F9FAFB; color: #1F2937; text-align: center; padding: 24px; }
    .box { max-width: 320px; }
    .ico { width: 64px; height: 64px; border-radius: 16px; background: #4F46E5; color: #fff; font-size: 30px;
           display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; }
    h1 { font-size: 20px; margin: 0 0 8px; }
    p { font-size: 14px; color: #6B7280; line-height: 1.5; margin: 0 0 20px; }
    button { background: #4F46E5; color: #fff; border: none; padding: 10px 22px; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>
  <div class="box">
    <div class="ico">&#128230;</div>
    <h1>You're offline</h1>
    <p>iSMART needs an internet connection to load equipment, students and borrowing records. Check your connection and try again.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
