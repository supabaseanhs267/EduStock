<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>EduStock - Activity</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="nav.css" />
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --primary: #4F46E5; --primary-bg: #EEF2FF;
            --success: #10B981; --success-bg: #ECFDF5;
            --warning: #F59E0B; --warning-bg: #FFFBEB;
            --danger: #EF4444; --danger-bg: #FEF2F2;
            --gray-50: #F9FAFB; --gray-100: #F3F4F6; --gray-200: #E5E7EB;
            --gray-400: #9CA3AF; --gray-500: #6B7280; --gray-600: #4B5563;
            --gray-700: #374151; --gray-800: #1F2937; --gray-900: #111827;
            --radius: 16px; --radius-sm: 10px;
            --shadow: 0 2px 8px rgba(0,0,0,0.08);
            --nav-height: 60px;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background: var(--gray-50);
            color: var(--gray-800);
            padding: 0 0 calc(var(--nav-height) + 16px) 0;
            min-height: 100vh;
        }
        
        .app-container {
            max-width: 480px;
            margin: 0 auto;
            padding: 16px 16px 24px;
        }
        
        .app-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 0 16px;
            border-bottom: 1px solid var(--gray-200);
            margin-bottom: 16px;
        }
        
        .app-header .back-btn {
            background: none; border: none; font-size: 20px; color: var(--gray-500);
            cursor: pointer; padding: 4px;
        }
        
        .app-header h2 { font-size: 20px; font-weight: 700; color: var(--gray-900); }
        .app-header h2 i { color: var(--primary); margin-right: 8px; }
        
        .filter-bar {
            display: flex; gap: 8px; margin-bottom: 12px; overflow-x: auto; flex-wrap: nowrap;
        }
        .filter-bar select, .filter-bar input {
            padding: 8px 12px; border: 1px solid var(--gray-200); border-radius: var(--radius-sm);
            font-size: 12px; background: white; font-family: 'Inter', sans-serif; flex-shrink: 0;
        }
        .filter-bar select:focus, .filter-bar input:focus { outline: none; border-color: var(--primary); }
        .filter-bar .export-btn {
            background: var(--success); color: white; border: none; padding: 6px 14px;
            border-radius: var(--radius-sm); font-weight: 600; font-size: 12px; cursor: pointer; flex-shrink: 0;
        }
        
        .activity-list {
            background: white; border-radius: var(--radius-sm); border: 1px solid var(--gray-200);
            overflow: hidden; box-shadow: var(--shadow);
        }
        
        .activity-item {
            display: flex; align-items: center; gap: 12px; padding: 12px 14px;
            border-bottom: 1px solid var(--gray-100);
        }
        .activity-item:last-child { border-bottom: none; }
        
        .activity-item .icon {
            width: 36px; height: 36px; border-radius: 50%; display: flex;
            align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0;
        }
        .activity-item .icon.borrow { background: var(--warning-bg); color: var(--warning); }
        .activity-item .icon.return { background: var(--success-bg); color: var(--success); }
        .activity-item .icon.add { background: var(--primary-bg); color: var(--primary); }
        .activity-item .icon.delete { background: var(--danger-bg); color: var(--danger); }
        .activity-item .icon.login { background: var(--primary-bg); color: var(--primary); }
        
        .activity-item .info { flex: 1; }
        .activity-item .info .title { font-size: 13px; font-weight: 500; color: var(--gray-800); }
        .activity-item .info .sub { font-size: 11px; color: var(--gray-500); }
        .activity-item .time { font-size: 10px; color: var(--gray-400); white-space: nowrap; }
        
        .empty-state { text-align: center; padding: 40px 20px; color: var(--gray-500); }
        .empty-state i { font-size: 40px; color: var(--gray-300); display: block; margin-bottom: 8px; }
        .empty-state h3 { color: var(--gray-700); font-size: 16px; }
        
        .toast {
            position: fixed; bottom: calc(var(--nav-height) + 16px); left: 16px; right: 16px;
            max-width: 400px; margin: 0 auto; padding: 12px 16px; border-radius: var(--radius-sm);
            color: white; font-weight: 500; font-size: 13px; box-shadow: var(--shadow-md);
            z-index: 1000; animation: slideUp 0.3s ease; display: flex; align-items: center; gap: 10px;
        }
        .toast.hidden { display: none; }
        .toast.success { background: var(--success); }
        .toast.error { background: var(--danger); }
        .toast.warning { background: var(--warning); }
        .toast.info { background: var(--primary); }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .toast .close-toast { background: none; border: none; color: white; cursor: pointer; font-size: 16px; margin-left: auto; opacity: 0.7; }
    </style>
</head>
<body>

    <div class="app-container">
        <header class="app-header">
            <button class="back-btn" onclick="window.location.href='dashboard.html'"><i class="fas fa-arrow-left"></i></button>
            <h2><i class="fas fa-history"></i>Activity Log</h2>
            <span style="font-size:12px;color:var(--gray-400);" id="logCount">0 entries</span>
        </header>

        <div class="filter-bar">
            <select id="actionFilter" onchange="renderActivity()">
                <option value="">All Actions</option>
                <option value="login">Login</option>
                <option value="logout">Logout</option>
                <option value="borrowed">Borrowed</option>
                <option value="returned">Returned</option>
                <option value="added">Added</option>
                <option value="deleted">Deleted</option>
                <option value="updated">Updated</option>
            </select>
            <input type="date" id="dateFilter" onchange="renderActivity()" />
            <button class="export-btn" onclick="exportLog()"><i class="fas fa-file-export"></i> Export</button>
        </div>

        <div class="activity-list" id="activityList"></div>
    </div>

    <nav class="bottom-nav">
        <button class="nav-item" data-page="dashboard"><i class="fas fa-th-large"></i><span>Home</span></button>
        <button class="nav-item" data-page="assets"><i class="fas fa-boxes"></i><span>Assets</span></button>
        <button class="nav-item" data-page="borrow"><i class="fas fa-hand-holding"></i><span>Borrow</span></button>
        <button class="nav-item" data-page="return"><i class="fas fa-undo-alt"></i><span>Return</span></button>
        <button class="nav-item" data-page="students"><i class="fas fa-users"></i><span>Students</span></button>
        <button class="nav-item active" data-page="settings"><i class="fas fa-cog"></i><span>Settings</span></button>
    </nav>

    <script src="app.js"></script>
    <script>
        let activityLog = [];

        function loadActivity() {
            const saved = localStorage.getItem('edustock_activity');
            if (saved) { try { activityLog = JSON.parse(saved); } catch(e) { initSampleActivity(); } } 
            else { initSampleActivity(); }
            renderAll();
        }

        function saveActivity() { localStorage.setItem('edustock_activity', JSON.stringify(activityLog)); }

        function initSampleActivity() {
            const now = new Date();
            activityLog = [
                { id: 1, action: 'login', user: 'Admin', details: 'Logged in', time: new Date(now - 1000 * 60 * 2).toISOString() },
                { id: 2, action: 'borrowed', user: 'Staff', details: 'Laptop Dell Latitude borrowed by Ashley M. Marquez', time: new Date(now - 1000 * 60 * 15).toISOString() },
                { id: 3, action: 'returned', user: 'Staff', details: 'Soldering Iron Kit returned by Juan Dela Cruz', time: new Date(now - 1000 * 60 * 30).toISOString() },
                { id: 4, action: 'added', user: 'Admin', details: 'New asset: Epson Projector (Qty: 3)', time: new Date(now - 1000 * 60 * 60).toISOString() },
                { id: 5, action: 'deleted', user: 'Admin', details: 'Old asset: Broken Monitor removed', time: new Date(now - 1000 * 60 * 60 * 2).toISOString() },
                { id: 6, action: 'updated', user: 'Staff', details: 'Lab Goggles quantity updated: 20 → 18', time: new Date(now - 1000 * 60 * 60 * 3).toISOString() },
                { id: 7, action: 'login', user: 'Staff', details: 'Logged in', time: new Date(now - 1000 * 60 * 60 * 4).toISOString() },
                { id: 8, action: 'borrowed', user: 'Staff', details: 'Arduino Starter Kit borrowed by Maria Santos', time: new Date(now - 1000 * 60 * 60 * 5).toISOString() },
            ];
            saveActivity();
        }

        function renderActivity() {
            const list = document.getElementById('activityList');
            const actionFilter = document.getElementById('actionFilter').value;
            const dateFilter = document.getElementById('dateFilter').value;

            let filtered = activityLog.filter(a => {
                const matchAction = !actionFilter || a.action === actionFilter;
                const matchDate = !dateFilter || a.time.startsWith(dateFilter);
                return matchAction && matchDate;
            });

            document.getElementById('logCount').textContent = `${filtered.length} entries`;

            if (filtered.length === 0) {
                list.innerHTML = `<div class="empty-state"><i class="fas fa-history"></i><h3>No Activity Found</h3><p>Try adjusting your filters.</p></div>`;
                return;
            }

            list.innerHTML = filtered.map(a => {
                const iconMap = { login: 'fa-sign-in-alt', logout: 'fa-sign-out-alt', borrowed: 'fa-hand-holding', returned: 'fa-undo-alt', added: 'fa-plus', deleted: 'fa-trash', updated: 'fa-edit' };
                const colorMap = { login: 'login', logout: 'login', borrowed: 'borrow', returned: 'return', added: 'add', deleted: 'delete', updated: 'add' };
                const actionLabels = { login: 'Login', logout: 'Logout', borrowed: 'Borrowed', returned: 'Returned', added: 'Added', deleted: 'Deleted', updated: 'Updated' };
                return `
                    <div class="activity-item">
                        <div class="icon ${colorMap[a.action] || 'login'}"><i class="fas ${iconMap[a.action] || 'fa-circle'}"></i></div>
                        <div class="info">
                            <div class="title">${actionLabels[a.action] || a.action} — ${a.details}</div>
                            <div class="sub">by <strong>${a.user}</strong></div>
                        </div>
                        <div class="time">${formatTimeAgo(a.time)}</div>
                    </div>
                `;
            }).join('');
        }

        function renderAll() { renderActivity(); }

        function exportLog() {
            if (activityLog.length === 0) { showToast('No logs to export.', 'warning'); return; }
            const headers = ['Time', 'User', 'Action', 'Details'];
            const rows = activityLog.map(a => [new Date(a.time).toLocaleString(), a.user, a.action, a.details]);
            const csv = [headers, ...rows].map(row => row.join(',')).join('\n');
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `edustock_activity_${new Date().toISOString().slice(0,10)}.csv`;
            a.click();
            URL.revokeObjectURL(url);
            showToast('📊 Activity log exported!', 'success');
        }

        document.addEventListener('DOMContentLoaded', loadActivity);
        console.log('📦 EduStock - Activity Log Page Loaded');
    </script>

</body>
</html>
