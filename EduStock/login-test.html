<!DOCTYPE html>
<html>
<head>
    <title>Login Test</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <h2>Login Test</h2>
    <form id="loginForm">
        <input type="email" id="email" placeholder="Email" value="admin@edustock.com" />
        <input type="password" id="password" placeholder="Password" value="Admin12345" />
        <button type="submit">Login</button>
    </form>
    <pre id="result"></pre>

    <script>
        const SUPABASE_URL = 'https://zvbbnwawvbmxfygvkyaq.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_LQd5C3G15qa-svzIDMadAw_ErT3Usmd';
        
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const result = document.getElementById('result');

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            result.textContent = '⏳ Logging in...';
            
            try {
                const { data, error } = await supabase.auth.signInWithPassword({
                    email: email,
                    password: password
                });
                
                if (error) {
                    result.textContent = '❌ Error: ' + error.message + '\nStatus: ' + error.status;
                    console.error('Full error:', error);
                } else {
                    result.textContent = '✅ Success!\nUser: ' + JSON.stringify(data.user, null, 2);
                    
                    // Now get user role
                    const { data: userData, error: userError } = await supabase
                        .from('users')
                        .select('*')
                        .eq('id', data.user.id)
                        .single();
                    
                    if (userError) {
                        result.textContent += '\n\n❌ User role error: ' + userError.message;
                    } else {
                        result.textContent += '\n\n✅ User role: ' + JSON.stringify(userData, null, 2);
                    }
                }
            } catch (err) {
                result.textContent = '❌ Exception: ' + err.message;
            }
        });
    </script>
</body>
</html>
