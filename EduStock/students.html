<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>EduStock - Students</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="nav.css" />
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --primary: #4F46E5; --primary-bg: #EEF2FF;
            --success: #10B981; --success-bg: #ECFDF5;
            --danger: #EF4444; --danger-bg: #FEF2F2;
            --gray-50: #F9FAFB; --gray-100: #F3F4F6; --gray-200: #E5E7EB;
            --gray-400: #9CA3AF; --gray-500: #6B7280; --gray-600: #4B5563;
            --gray-700: #374151; --gray-800: #1F2937; --gray-900: #111827;
            --radius: 16px; --radius-sm: 10px;
            --shadow: 0 2px 8px rgba(0,0,0,0.08);
            --shadow-md: 0 4px 16px rgba(0,0,0,0.12);
            --nav-height: 60px;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background: var(--gray-50);
            color: var(--gray-800);
            padding: 0 0 calc(var(--nav-height) + 16px) 0;
            min-height: 100vh;
        }
        
        .app-container {
            max-width: 480px;
            margin: 0 auto;
            padding: 16px 16px 24px;
        }
        
        .app-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 0 16px;
            border-bottom: 1px solid var(--gray-200);
            margin-bottom: 16px;
        }
        
        .app-header .back-btn {
            background: none; border: none; font-size: 20px; color: var(--gray-500);
            cursor: pointer; padding: 4px;
        }
        
        .app-header h2 { font-size: 20px; font-weight: 700; color: var(--gray-900); }
        .app-header h2 i { color: var(--primary); margin-right: 8px; }
        
        .search-bar {
            display: flex; gap: 8px; margin-bottom: 12px;
        }
        .search-bar input {
            flex: 1; padding: 10px 14px; border: 1px solid var(--gray-200); border-radius: var(--radius-sm);
            font-family: 'Inter', sans-serif; font-size: 14px; background: white;
        }
        .search-bar input:focus { outline: none; border-color: var(--primary); }
        
        .filter-chips {
            display: flex; gap: 6px; margin-bottom: 12px; overflow-x: auto; flex-wrap: nowrap; padding-bottom: 4px;
        }
        .filter-chips button {
            padding: 4px 14px; border-radius: 16px; border: 1px solid var(--gray-200);
            background: white; color: var(--gray-600); font-size: 12px; font-weight: 500;
            white-space: nowrap; cursor: pointer;
        }
        .filter-chips button.active { border-color: var(--primary); background: var(--primary-bg); color: var(--primary); }
        
        .student-list { display: flex; flex-direction: column; gap: 8px; }
        .student-card {
            background: white; border-radius: var(--radius-sm); border: 1px solid var(--gray-200);
            padding: 12px 14px; display: flex; align-items: center; gap: 12px;
        }
        .student-card .avatar {
            width: 44px; height: 44px; border-radius: 50%; background: var(--primary-bg);
            display: flex; align-items: center; justify-content: center; color: var(--primary);
            font-weight: 700; font-size: 18px; flex-shrink: 0;
        }
        .student-card .info { flex: 1; }
        .student-card .info .name { font-size: 14px; font-weight: 600; color: var(--gray-800); }
        .student-card .info .details { font-size: 12px; color: var(--gray-500); }
        .student-card .info .lrn { font-size: 11px; color: var(--gray-400); font-weight: 500; }
        
        .fab {
            position: fixed; bottom: calc(var(--nav-height) + 16px); right: 16px;
            width: 54px; height: 54px; border-radius: 50%; background: var(--primary);
            color: white; border: none; font-size: 24px; box-shadow: var(--shadow-md);
            cursor: pointer; z-index: 50; max-width: 480px; margin: 0 auto;
            display: flex; align-items: center; justify-content: center;
        }
        .fab:active { transform: scale(0.9); }
        
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5); z-index: 200; align-items: flex-end; justify-content: center;
            padding: 0 16px calc(var(--nav-height) + 16px);
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: white; border-radius: var(--radius) var(--radius) 0 0;
            width: 100%; max-width: 480px; max-height: 85vh; overflow-y: auto;
            padding: 20px 20px 32px; animation: modalSlideUp 0.3s ease;
        }
        @keyframes modalSlideUp { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--gray-200); }
        .modal-header h3 { font-size: 18px; font-weight: 700; }
        .modal-header .close-btn { background: none; border: none; font-size: 24px; color: var(--gray-400); cursor: pointer; }
        .modal .form-group { margin-bottom: 14px; }
        .modal .form-group label { display: block; font-size: 13px; font-weight: 600; color: var(--gray-700); margin-bottom: 4px; }
        .modal .form-group label .required { color: var(--danger); }
        .modal .form-group input, .modal .form-group select {
            width: 100%; padding: 10px 14px; border: 1px solid var(--gray-200); border-radius: var(--radius-sm);
            font-family: 'Inter', sans-serif; font-size: 14px; background: white;
        }
        .modal .form-group input:focus, .modal .form-group select:focus { outline: none; border-color: var(--primary); }
        .modal .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .modal .form-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--gray-200); }
        .modal .btn-primary { background: var(--primary); color: white; border: none; padding: 10px 24px; border-radius: var(--radius-sm); font-weight: 600; font-size: 14px; cursor: pointer; }
        .modal .btn-secondary { background: var(--gray-100); color: var(--gray-700); border: 1px solid var(--gray-200); padding: 10px 20px; border-radius: var(--radius-sm); font-weight: 500; font-size: 14px; cursor: pointer; }
        
        .toast {
            position: fixed; bottom: calc(var(--nav-height) + 16px); left: 16px; right: 16px;
            max-width: 400px; margin: 0 auto; padding: 12px 16px; border-radius: var(--radius-sm);
            color: white; font-weight: 500; font-size: 13px; box-shadow: var(--shadow-md);
            z-index: 1000; animation: slideUp 0.3s ease; display: flex; align-items: center; gap: 10px;
        }
        .toast.hidden { display: none; }
        .toast.success { background: var(--success); }
        .toast.error { background: var(--danger); }
        .toast.info { background: var(--primary); }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .toast .close-toast { background: none; border: none; color: white; cursor: pointer; font-size: 16px; margin-left: auto; opacity: 0.7; }
        
        .empty-state { text-align: center; padding: 40px 20px; color: var(--gray-500); }
        .empty-state i { font-size: 40px; color: var(--gray-300); display: block; margin-bottom: 8px; }
        .empty-state h3 { color: var(--gray-700); font-size: 16px; }
        
        @media (max-width: 420px) {
            .modal .form-row { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <header class="app-header">
            <button class="back-btn" onclick="window.location.href='dashboard.html'"><i class="fas fa-arrow-left"></i></button>
            <h2><i class="fas fa-users"></i>Students</h2>
            <span style="font-size:12px;color:var(--gray-400);" id="studentCount">0 enrolled</span>
        </header>

        <div class="search-bar">
            <input type="text" id="studentSearch" placeholder="🔍 Search by LRN, Name, Grade..." oninput="renderStudents()" />
        </div>

        <div class="filter-chips" id="filterChips">
            <button class="active" onclick="filterStudents('all', this)">All</button>
            <button onclick="filterStudents('Grade 7', this)">Grade 7</button>
            <button onclick="filterStudents('Grade 8', this)">Grade 8</button>
            <button onclick="filterStudents('Grade 9', this)">Grade 9</button>
            <button onclick="filterStudents('Grade 10', this)">Grade 10</button>
        </div>

        <div class="student-list" id="studentList"></div>
    </div>

    <button class="fab" onclick="openAddStudentModal()"><i class="fas fa-user-plus"></i></button>

    <div class="modal-overlay" id="studentModal">
        <div class="modal">
            <div class="modal-header">
                <h3>Add Student</h3>
                <button class="close-btn" onclick="closeStudentModal()">&times;</button>
            </div>
            <form id="studentForm" onsubmit="saveStudent(event)">
                <div class="form-group">
                    <label>LRN <span class="required">*</span></label>
                    <input type="text" id="studentLRN" placeholder="12-digit LRN" required />
                </div>
                <div class="form-group">
                    <label>Full Name <span class="required">*</span></label>
                    <input type="text" id="studentName" placeholder="Full name" required />
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Grade Level <span class="required">*</span></label>
                        <select id="studentGrade" required>
                            <option value="">Select</option>
                            <option value="Grade 7">Grade 7</option>
                            <option value="Grade 8">Grade 8</option>
                            <option value="Grade 9">Grade 9</option>
                            <option value="Grade 10">Grade 10</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Section</label>
                        <input type="text" id="studentSection" placeholder="e.g., Section A" />
                    </div>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn-secondary" onclick="closeStudentModal()">Cancel</button>
                    <button type="submit" class="btn-primary"><i class="fas fa-save"></i> Save</button>
                </div>
            </form>
        </div>
    </div>

    <nav class="bottom-nav">
        <button class="nav-item" data-page="dashboard"><i class="fas fa-th-large"></i><span>Home</span></button>
        <button class="nav-item" data-page="assets"><i class="fas fa-boxes"></i><span>Assets</span></button>
        <button class="nav-item" data-page="borrow"><i class="fas fa-hand-holding"></i><span>Borrow</span></button>
        <button class="nav-item" data-page="return"><i class="fas fa-undo-alt"></i><span>Return</span></button>
        <button class="nav-item active" data-page="students"><i class="fas fa-users"></i><span>Students</span></button>
        <button class="nav-item" data-page="settings"><i class="fas fa-cog"></i><span>Settings</span></button>
    </nav>

    <script src="app.js"></script>
    <script>
        let students = [];
        let nextStudentId = 1;

        function loadStudents() {
            const saved = localStorage.getItem('edustock_students');
            if (saved) {
                try { const data = JSON.parse(saved); students = data.students || []; nextStudentId = data.nextId || students.length + 1; }
                catch(e) { initSampleStudents(); }
            } else { initSampleStudents(); }
            renderAll();
        }

        function saveStudents() {
            localStorage.setItem('edustock_students', JSON.stringify({ students, nextId: nextStudentId }));
        }

        function initSampleStudents() {
            students = [
                { id: 1, lrn: '107215160057', name: 'Ashley M. Marquez', grade: 'Grade 10', section: 'Section A' },
                { id: 2, lrn: '107215160058', name: 'Juan Dela Cruz', grade: 'Grade 7', section: 'Section A' },
                { id: 3, lrn: '107215160059', name: 'Maria Santos', grade: 'Grade 8', section: 'Section B' },
                { id: 4, lrn: '107215160060', name: 'Jose Rizal', grade: 'Grade 9', section: 'Section C' },
                { id: 5, lrn: '107215160061', name: 'Andres Bonifacio', grade: 'Grade 10', section: 'Section D' },
            ];
            nextStudentId = 6;
            saveStudents();
        }

        function addStudent(data) {
            const student = { id: nextStudentId++, ...data };
            students.push(student);
            saveStudents();
            renderAll();
            showToast('✅ Student added successfully!', 'success');
            return student;
        }

        function renderStudents() {
            const list = document.getElementById('studentList');
            const search = document.getElementById('studentSearch').value.toLowerCase();
            const gradeFilter = document.getElementById('studentList').dataset.filter || 'all';

            let filtered = students.filter(s => {
                const matchSearch = s.lrn.includes(search) || s.name.toLowerCase().includes(search) || s.grade.toLowerCase().includes(search) || s.section?.toLowerCase().includes(search);
                const matchGrade = gradeFilter === 'all' || s.grade === gradeFilter;
                return matchSearch && matchGrade;
            });

            document.getElementById('studentCount').textContent = `${students.length} enrolled`;

            if (filtered.length === 0) {
                list.innerHTML = `<div class="empty-state"><i class="fas fa-user-graduate"></i><h3>No Students Found</h3><p>Add a student to get started.</p></div>`;
                return;
            }

            list.innerHTML = filtered.map(s => `
                <div class="student-card">
                    <div class="avatar">${s.name.split(' ').map(n => n[0]).join('').toUpperCase().slice(0, 2)}</div>
                    <div class="info">
                        <div class="name">${s.name}</div>
                        <div class="details">${s.grade} • ${s.section || 'No Section'}</div>
                        <div class="lrn">LRN: ${s.lrn}</div>
                    </div>
                </div>
            `).join('');
        }

        function renderAll() { renderStudents(); }

        function filterStudents(grade, btn) {
            document.querySelectorAll('.filter-chips button').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById('studentList').dataset.filter = grade;
            renderStudents();
        }

        function openAddStudentModal() {
            document.getElementById('studentModal').classList.add('active');
            document.getElementById('studentForm').reset();
        }

        function closeStudentModal() { document.getElementById('studentModal').classList.remove('active'); }

        function saveStudent(e) {
            e.preventDefault();
            const data = {
                lrn: document.getElementById('studentLRN').value.trim(),
                name: document.getElementById('studentName').value.trim(),
                grade: document.getElementById('studentGrade').value,
                section: document.getElementById('studentSection').value.trim()
            };
            if (!data.lrn || !data.name || !data.grade) {
                showToast('Please fill in all required fields.', 'error');
                return;
            }
            if (data.lrn.length !== 12) {
                showToast('LRN must be exactly 12 digits.', 'error');
                return;
            }
            addStudent(data);
            closeStudentModal();
        }

        document.getElementById('studentModal').addEventListener('click', function(e) {
            if (e.target === this) closeStudentModal();
        });

        document.addEventListener('DOMContentLoaded', loadStudents);
        console.log('📦 EduStock - Students Page Loaded');
    </script>

</body>
</html>
